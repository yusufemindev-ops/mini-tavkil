<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The header's logo tile as an icon: brand orange square, white T. A square
       reads better than a glyph at 16px, and it is the mark people already
       associate with the site.

       The T is a path, not <text>. Favicons render with no webfonts loaded, so a
       text element falls back to whatever the OS happens to resolve — the letter
       then differs in weight and width between machines, which is exactly the
       kind of drift nobody can reproduce. A path is the same everywhere. -->
  <rect width="64" height="64" rx="14" fill="#f2640c"/>
  <path d="M13.5 16H50.5V25.5H37V48H27V25.5H13.5Z" fill="#ffffff"/>
</svg>
