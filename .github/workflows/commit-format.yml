name: Commit format
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-commit-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate every commit message in this PR
        run: |
          set -euo pipefail

          # Skip check for automated dependency bots (e.g. Dependabot)
          if [[ "${{ github.actor }}" == "dependabot[bot]" || "${{ github.head_ref }}" =~ ^dependabot/ ]]; then
            echo "✅ Automated dependency PR: skipping ticket format check"
            exit 0
          fi

          re='^(feat|fix|chore|refactor|perf|docs|test|build|ci): \[TSC-[0-9]+\] .+$'
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          while IFS= read -r msg; do
            if ! [[ "$msg" =~ $re ]]; then
              echo "❌ Bad commit: $msg"
              fail=1
            fi
          done < <(git log --no-merges --format=%s "$base..$head")
          if [ "$fail" = 1 ]; then
            echo ""
            echo "Format: <type>: [TSC-XXX] <description>"
            exit 1
          fi
          echo "✅ All commit messages OK"
