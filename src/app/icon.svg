<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The header's logo tile, as an icon: brand orange square, white T.
       Squares read better than glyphs at 16px, and this is the mark people
       already associate with the site. -->
  <rect width="64" height="64" rx="14" fill="#f2640c"/>
  <text x="32" y="45" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">T</text>
</svg>
